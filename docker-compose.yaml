
services:
  airflow:
    image: apache/airflow:2.10.5
    container_name: airflow_clinica
    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas duckdb"

    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/proyecto

    command: standalone
    restart: unless-stopped
